name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

      - name: Validate JSON under api/
        run: |
          python3 <<'PY'
          import json
          import pathlib
          import sys

          errors: list[str] = []
          for path in sorted(pathlib.Path("api").rglob("*.json")):
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          PY
